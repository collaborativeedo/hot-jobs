name: Find careers pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/probe.json"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - run: python scripts/probe.py
      - run: |
          git config user.name "hot-jobs-bot"
          git config user.email "hot-jobs-bot@users.noreply.github.com"
          git add data/probe-results.json
          git diff --cached --quiet || (git commit -m "Careers page probe results" && git pull --rebase origin main && git push)
