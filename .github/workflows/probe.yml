name: Probe (staff debugging)

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Python to run from the repo root (scripts/ is on the path); its printed output is saved"
        required: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Run it
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          mkdir -p data/debug
          python - > data/debug/probe.txt 2>&1 <<'PY' || true
          import os, sys
          sys.path.insert(0, "scripts")
          exec(os.environ["SCRIPT"])
          PY
          tail -c 3000 data/debug/probe.txt
      - run: |
          git config user.name "hot-jobs-bot"
          git config user.email "hot-jobs-bot@users.noreply.github.com"
          git add data/debug
          git diff --cached --quiet || (git commit -m "Probe output" && git pull --rebase -X theirs origin main && git push)
