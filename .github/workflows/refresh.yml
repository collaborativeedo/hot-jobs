name: Refresh and publish

on:
  schedule:
    - cron: "17 10 * * *"   # 3:17 a.m. Pacific in summer, 2:17 a.m. in winter
  workflow_dispatch:        # run by hand from the Actions tab
  push:
    branches: [main]
    paths: ["docs/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Pull and tag Lane County postings
        if: github.event_name != 'push'
        run: python scripts/refresh.py

      - name: Save results to the repository
        if: always() && github.event_name != 'push'
        run: |
          git config user.name "hot-jobs-bot"
          git config user.email "hot-jobs-bot@users.noreply.github.com"
          git add docs/ data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Nightly refresh $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs origin main || git pull --rebase origin main
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
