name: Read chamber of commerce directories

on:
  schedule:
    - cron: "41 13 1 * *"   # first of each month, about 6:41 a.m. Pacific: catch new members
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: chambers
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - run: python scripts/chambers.py
      - if: always()
        run: |
          git config user.name "hot-jobs-bot"
          git config user.email "hot-jobs-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Chamber directories: members read" && git pull --rebase -X theirs origin main && git push)
      - name: Look for careers pages on members' websites
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run discover.yml --ref main
